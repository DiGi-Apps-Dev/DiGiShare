services:
  digishare:
    container_name: digishare
    image: digishare:latest
    build: .
    restart: unless-stopped
    init: true
    user: "1000:100"
    env_file: .env
    environment:
      PORTA: "8795"
      INDIRIZZO: 0.0.0.0
      CARTELLA_DATI: /app/dati
      CARTELLA_BACKUP: /app/backups
    ports:
      - "8795:8795"
    volumes:
      # Database, video, audio e copertine: mettila su un disco con spazio.
      - ./dati:/app/dati
      # Backup cifrati (ultime 10 copie).
      - ./backups:/app/backups
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  # Facoltativo: riconosce la voce di chi registra. Nessuna porta verso fuori. Vedi voci/LEGGIMI.txt.
  digishare-voce:
    profiles: [voce]
    container_name: digishare-voce
    image: digishare-voce:latest
    build: ./voci
    restart: unless-stopped
    init: true
    user: "1000:100"
    volumes:
      - ./dati/audio:/audio:ro
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
